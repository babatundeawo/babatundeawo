name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3" # every Wednesday, 04:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # lets CodeQL report findings in the Security tab
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: python
          build-mode: none

      - name: Run analysis
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:python"
