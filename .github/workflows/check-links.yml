name: Check links

on:
  pull_request:
    paths: ["README.md", "docs/**"]
  schedule:
    - cron: "23 5 1 * *" # first day of each month, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Report broken links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      # Reports problems in the run log without failing the run: external sites
      # sometimes block automated checks, so a red cross here is only a hint.
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --accept 200,204,206,403,429
            --exclude '^mailto:'
            README.md docs/*.md
          fail: false
