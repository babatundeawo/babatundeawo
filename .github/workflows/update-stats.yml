name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday, 03:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

# Only one run at a time; a newer run replaces a waiting one.
concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stats:
    name: Refresh stat cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # lets the job save the refreshed SVG files
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I .github/scripts/generate_stats.py

      - name: Save changes
        run: |
          if git diff --quiet -- assets; then
            echo "Stat cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git commit -m "chore: refresh profile stat cards"
          git push
